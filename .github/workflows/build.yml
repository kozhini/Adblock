name: Build adblock

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: "24.10.6"
  SDK_URL: "https://downloads.openwrt.org/releases/24.10.6/targets/mediatek/filogic/openwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"

jobs:
  build:
    name: Build adblock 4.5.7
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            clang \
            flex \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            zstd \
            xz-utils \
            file

      - name: Download OpenWrt SDK
        run: |
          wget -q --show-progress \
            "$SDK_URL" \
            -O /tmp/openwrt-sdk.tar.zst

      - name: Extract OpenWrt SDK
        run: |
          mkdir -p "$HOME/sdk"

          tar \
            --use-compress-program=unzstd \
            -xf /tmp/openwrt-sdk.tar.zst \
            -C "$HOME/sdk"

          SDK_DIR="$(find "$HOME/sdk" -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          if [ -z "$SDK_DIR" ]; then
            echo "ERROR: SDK directory was not found"
            exit 1
          fi

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare SDK
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds update -a

      - name: Add adblock package
        run: |
          rm -rf "${SDK_DIR}/package/adblock"
          mkdir -p "${SDK_DIR}/package/adblock"

          cp Makefile "${SDK_DIR}/package/adblock/Makefile"
          cp -a files "${SDK_DIR}/package/adblock/files"

      - name: Verify package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "=== Makefile ==="
          sed -n '1,120p' package/adblock/Makefile

          echo
          echo "=== Files ==="
          find package/adblock/files -maxdepth 1 -type f -print | sort

          echo
          echo "=== sort handling ==="
          grep -n -A6 -B4 'sort-coreutils' \
            package/adblock/files/adblock.sh || true

      - name: Configure package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "CONFIG_PACKAGE_adblock=m" > .config
          make defconfig

      - name: Build adblock
        working-directory: ${{ env.SDK_DIR }}
        run: |
          make package/adblock/compile V=s

      - name: Find package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "=== Generated adblock packages ==="

          find bin/packages \
            -type f \
            -name 'adblock_*.ipk' \
            -print

          PACKAGE="$(find bin/packages \
            -type f \
            -name 'adblock_*.ipk' \
            | head -n 1)"

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: adblock .ipk was not generated"
            exit 1
          fi

          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Verify package metadata
        run: |
          echo "Package:"
          ls -lh "$SDK_DIR/$PACKAGE"

          echo
          echo "Package type:"
          file "$SDK_DIR/$PACKAGE"

      - name: Collect artifact
        run: |
          mkdir -p artifacts

          cp "$SDK_DIR/$PACKAGE" artifacts/

          echo "=== Artifact ==="
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adblock-${{ env.OPENWRT_VERSION }}-mediatek-filogic
          path: artifacts/adblock_*.ipk
          if-no-files-found: error
