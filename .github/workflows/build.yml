name: Build OpenWrt Package

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version"
        required: true
        default: "24.10.6"
      target:
        description: "Target"
        required: true
        default: "mediatek"
      subtarget:
        description: "Subtarget"
        required: true
        default: "filogic"
      arch:
        description: "Architecture"
        required: true
        default: "aarch64_cortex-a53"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      TARGET: ${{ inputs.target }}
      SUBTARGET: ${{ inputs.subtarget }}
      ARCH: ${{ inputs.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read package version
        id: pkg_version
        run: |
          VERSION=$(grep '^PKG_VERSION:=' Makefile | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Download OpenWrt SDK
        run: |
          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}"
          SDK_FILENAME=$(curl -s "${BASE_URL}/sha256sums" | grep -o "openwrt-sdk-[^*]*\.tar\.zst" | head -1)
          if [ -z "$SDK_FILENAME" ]; then
            echo "ERROR: SDK not found"
            exit 1
          fi
          echo "Downloading: ${SDK_FILENAME}"
          wget -q "${BASE_URL}/${SDK_FILENAME}" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* openwrt-sdk

      - name: Update feeds
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds uninstall adblock luci-app-adblock
          rm -rf feeds/packages/net/adblock
          rm -rf feeds/luci/applications/luci-app-adblock
          cp feeds/luci/luci.mk luci.mk

      - name: Copy packages to SDK
        run: |
          mkdir -p openwrt-sdk/package/adblock
          cp Makefile openwrt-sdk/package/adblock/
          cp -r files openwrt-sdk/package/adblock/

          mkdir -p openwrt-sdk/package/luci-app-adblock
          cp -r luci-app-adblock/. openwrt-sdk/package/luci-app-adblock/

      - name: Configure packages
        working-directory: openwrt-sdk
        run: |
          echo "CONFIG_PACKAGE_adblock=m" > .config
          echo "CONFIG_PACKAGE_luci-app-adblock=m" >> .config
          make defconfig

      - name: Compile packages
        working-directory: openwrt-sdk
        env:
          SOURCE_DATE_EPOCH: 1700000000
        run: |
          make package/adblock/clean V=s
          make package/adblock/compile V=s -j"$(nproc)"
          make package/luci-app-adblock/clean V=s
          make package/luci-app-adblock/compile V=s -j"$(nproc)"

      - name: Find built packages
        run: |
          find openwrt-sdk/bin/packages -type f -name "*.ipk" -ls

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: adblock-${{ env.OPENWRT_VERSION }}-${{ env.ARCH }}
          path: |
            openwrt-sdk/bin/packages/**/adblock*.ipk
            openwrt-sdk/bin/packages/**/luci-app-adblock*.ipk
          if-no-files-found: error

      - name: Prepare release files
        id: prepare_release
        run: |
          mkdir -p release
          find openwrt-sdk/bin/packages -name "adblock*.ipk" -exec cp {} release/ \;
          find openwrt-sdk/bin/packages -name "luci-app-adblock*.ipk" -exec cp {} release/ \;
          TAG="openwrt-${OPENWRT_VERSION}-${{ steps.pkg_version.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag }}
          name: OpenWrt ${{ inputs.openwrt_version }} - adblock ${{ steps.pkg_version.outputs.version }}
          body: |
            adblock for OpenWrt ${{ inputs.openwrt_version }}
            Architecture: all
          files: release/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
